<style>
:root {

  --bg: #f4ede4;
  --bg-alt: #ebe2d4;
  --card-bg: #ffffff;
  --text: #2d3540;
  --text-secondary: #6a7280;
  --text-dim: #98a0aa;
  --heading: #1a2230;
  --border: #e0d6c8;

  --accent: #2c4054;        /* 深海蓝 */
  --accent-soft: #4a6280;
  --accent-gold: #b08d52;   /* 金色 */
  --accent-red: #b87070;    /* 暗红（呼应海图头像） */

  --green: #5a8068;
  --gold: #b08d52;
  --red: #b87070;
  --tag-bg: #ede5d6;

  --shadow: 0 2px 12px rgba(20,30,50,0.07);
  --shadow-lg: 0 8px 32px rgba(20,30,50,0.12);
}
[data-theme="dark"] {
  --bg: #1a1d24;
  --bg-alt: #22262e;
  --card-bg: #2a2e36;
  --text: #e6dfd2;
  --text-secondary: #a8a092;
  --text-dim: #706860;
  --heading: #f0e8d8;
  --border: #3a3a40;

  --accent: #6a8aaa;
  --accent-soft: #4a6a8a;
  --accent-gold: #c9a872;
  --accent-red: #c08080;

  --green: #7a9a7a;
  --gold: #c9a872;
  --red: #c08080;
  --tag-bg: #34313a;

  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.45);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.4s, color 0.3s;
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

/* ── HERO（压缩版） ── */
.hero {
  display: flex; align-items: center; justify-content: center; gap: 22px;
  padding: 28px 24px;
  background: var(--bg-alt);
  border-bottom: 1px solid var(--border);
  position: relative;
  flex-wrap: wrap;
}
.theme-toggle {
  position: absolute; top: 16px; right: 20px;
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 12px; cursor: pointer;
  font-size: 1rem; transition: all 0.2s;
  box-shadow: var(--shadow);
}
.theme-toggle:hover { transform: scale(1.08); }

.haitu-portrait {
  width: 64px; height: 64px;
  border-radius: 50%;
  display: block;
  border: 2px solid var(--card-bg);
  box-shadow: 0 2px 10px rgba(184, 112, 112, 0.25);
  background: var(--accent-red);
  flex-shrink: 0;
}

.hero-text { display: flex; flex-direction: column; gap: 4px; }

.brand-name {
  font-family: 'Noto Serif SC', Georgia, serif;
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--heading);
  line-height: 1.2;
}
.brand-name .accent { color: var(--accent-red); }

.slogan {
  font-family: 'Noto Serif SC', Georgia, serif;
  font-size: 0.95rem;
  color: var(--text-secondary);
  font-style: italic;
  letter-spacing: 1px;
}
.slogan::before { content: '「'; color: var(--accent-gold); }
.slogan::after { content: '」'; color: var(--accent-gold); }

/* ── SECTION ── */
.section { padding: 40px 0; }
.section.first { padding-top: 32px; }
.section-title {
  display: flex; align-items: center; gap: 12px;
  font-family: 'Noto Serif SC', serif;
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: 2px;
  color: var(--text-secondary);
  margin-bottom: 28px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.section-title::before {
  content: '';
  display: inline-block;
  width: 4px; height: 20px;
  background: var(--accent-gold);
  border-radius: 2px;
}

/* ── REPORT CARDS ── */
.report-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 22px;
}
.report-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 26px;
  text-decoration: none;
  color: var(--text);
  transition: all 0.25s ease;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.report-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--accent-gold);
  opacity: 0.6;
}
.report-card:hover {
  transform: translateY(-4px);
  border-color: var(--accent-gold);
  box-shadow: var(--shadow-lg);
}
.report-card .ticker {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 1.5px;
  margin-bottom: 8px;
}
.report-card h3 {
  font-family: 'Noto Serif SC', serif;
  font-size: 1.18rem;
  font-weight: 600;
  margin-bottom: 10px;
  line-height: 1.45;
  color: var(--heading);
}
.report-card .desc {
  color: var(--text-secondary);
  font-size: 0.91rem;
  line-height: 1.65;
  flex: 1;
  margin-bottom: 16px;
}
.report-card .meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.8rem;
  color: var(--text-dim);
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.tag {
  display: inline-block;
  background: var(--tag-bg);
  padding: 4px 11px;
  border-radius: 11px;
  font-size: 0.74rem;
  font-weight: 500;
  letter-spacing: 0.3px;
}
.tag.buy { color: var(--green); background: rgba(90,128,104,0.13); }
.tag.hold { color: var(--gold); background: rgba(176,141,82,0.13); }
.tag.sell { color: var(--red); background: rgba(184,112,112,0.13); }

/* ── CALENDAR PANEL ── */
.calendar-panel {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.cal-header {
  display: grid;
  grid-template-columns: 110px 90px 110px 1fr 130px;
  gap: 14px;
  padding: 14px 22px;
  background: var(--bg-alt);
  border-bottom: 1px solid var(--border);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-dim);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.cal-row {
  display: grid;
  grid-template-columns: 110px 90px 110px 1fr 130px;
  gap: 14px;
  padding: 14px 22px;
  border-bottom: 1px solid var(--border);
  align-items: center;
  transition: background 0.2s;
}
.cal-row:last-child { border-bottom: none; }
.cal-row:hover { background: var(--bg-alt); }
.cal-row.past { opacity: 0.45; }
.cal-row.today { background: rgba(176,141,82,0.08); }
.cal-row.today:hover { background: rgba(176,141,82,0.13); }
.cal-row.upcoming { }
.cal-date {
  font-family: 'Segoe UI', monospace;
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text);
}
.cal-date .day-of-week {
  display: block;
  font-size: 0.7rem;
  color: var(--text-dim);
  font-weight: 400;
  margin-top: 2px;
}
.cal-ticker {
  font-family: 'Noto Sans SC', sans-serif;
  font-weight: 700;
  font-size: 0.78rem;
  color: var(--accent);
  letter-spacing: 0.5px;
}
.cal-type {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 0.72rem;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 10px;
  display: inline-block;
  text-align: center;
  letter-spacing: 0.3px;
}
.cal-type.earnings { background: rgba(44,64,84,0.10); color: var(--accent); }
.cal-type.ex-div { background: rgba(176,141,82,0.13); color: var(--gold); }
.cal-type.record { background: rgba(74,98,128,0.10); color: var(--accent-soft); }
.cal-type.payment { background: rgba(90,128,104,0.13); color: var(--green); }
.cal-detail {
  font-size: 0.85rem;
  color: var(--text-secondary);
  line-height: 1.55;
}
.cal-detail strong { color: var(--text); font-weight: 600; }
.cal-action {
  text-align: right;
}
.cal-action a {
  display: inline-block;
  font-size: 0.72rem;
  color: var(--text-dim);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 10px;
  text-decoration: none;
  transition: all 0.2s;
  letter-spacing: 0.3px;
}
.cal-action a:hover {
  color: var(--accent);
  border-color: var(--accent);
}
.cal-empty {
  padding: 40px;
  text-align: center;
  color: var(--text-dim);
  font-style: italic;
}
@media (max-width: 768px) {
  .cal-header { display: none; }
  .cal-row {
    grid-template-columns: 1fr;
    gap: 6px;
    padding: 14px 18px;
  }
  .cal-action { text-align: left; }
  .cal-action a { font-size: 0.7rem; }
}

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center;
  padding: 60px 24px;
  color: var(--text-dim);
  font-style: italic;
  background: var(--card-bg);
  border: 1px dashed var(--border);
  border-radius: 14px;
}
.empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.5; }

/* ── ABOUT ── */
.about-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 36px 40px;
  box-shadow: var(--shadow);
  font-family: 'Noto Serif SC', serif;
  line-height: 2.0;
  font-size: 1rem;
  color: var(--text);
}
.about-card p { margin-bottom: 16px; }
.about-card p:last-child { margin-bottom: 0; }
.about-card strong { color: var(--accent-red); }

/* ── FOOTER ── */
footer {
  text-align: center;
  margin-top: 40px;
  padding: 32px 24px 40px;
  border-top: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 0.82rem;
  background: var(--bg-alt);
}
footer p { margin-bottom: 6px; }

@media (max-width: 768px) {
  .brand-name { font-size: 1.4rem; letter-spacing: 2px; }
  .slogan { font-size: 0.88rem; }
  .haitu-portrait { width: 56px; height: 56px; }
  .hero { padding: 22px 20px; gap: 16px; }
  .section { padding: 32px 0; }
}
</style>

function renderCalendar() {
  const container = document.getElementById('calendarRows');
  if (!calendar.length) {
    container.innerHTML = '<div class="cal-empty">尚无即将到来的事件</div>';
    return;
  }

  // 按日期排序：未来 → 今天 → 过去
  const today = new Date('2026-04-29');
  today.setHours(0, 0, 0, 0);

  calendar.sort((a, b) => new Date(a.date) - new Date(b.date));

  // Filter: 显示过去 30 天 + 未来全部
  const filtered = calendar.filter(e => {
    const d = new Date(e.date);
    const diffDays = (d - today) / (1000 * 60 * 60 * 24);
    return diffDays >= -30; // 显示过去 30 天 + 未来
  });

  const dayNames = ['周日','周一','周二','周三','周四','周五','周六'];

  container.innerHTML = filtered.map(e => {
    const d = new Date(e.date);
    const isPast = d < today;
    const isToday = d.getTime() === today.getTime();
    const cls = isPast ? 'past' : (isToday ? 'today' : 'upcoming');
    const dow = dayNames[d.getDay()];
    const todayLabel = isToday ? ' <span style="color:var(--accent-gold);font-weight:700;">· 今天</span>' : '';
    return `
      <div class="cal-row ${cls}">
        <div class="cal-date">${e.date}<span class="day-of-week">${dow}${todayLabel}</span></div>
        <div class="cal-ticker">${e.ticker}</div>
        <div><span class="cal-type ${e.type}">${e.typeLabel}</span></div>
        <div class="cal-detail">${e.detail}</div>
        <div class="cal-action">
          <a href="https://xueqiu.com/S/${e.xueqiu}" target="_blank" rel="noopener">雪球 →</a>
        </div>
      </div>
    `;
  }).join('');
}
renderCalendar();

/* ── THEME TOGGLE ── */
function toggleTheme() {
  const d = document.documentElement;
  const btn = document.getElementById('themeBtn');
  if (d.getAttribute('data-theme') === 'dark') {
    d.removeAttribute('data-theme');
    btn.textContent = '🌙';
    localStorage.setItem('theme', 'light');
  } else {
    d.setAttribute('data-theme', 'dark');
    btn.textContent = '☀️';
    localStorage.setItem('theme', 'dark');
  }
}
(function() {
  const t = localStorage.getItem('theme');
  if (t === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('themeBtn').textContent = '☀️';
    });
  }
})();
</script>
