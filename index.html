function renderReports() {
  const grid = document.getElementById('reportGrid');
  if (reports.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column: 1 / -1;">
        <div class="empty-icon">🌊</div>
        <p>第一份海图研判正在准备中……</p>
      </div>
    `;
    return;
  }
  reports.sort((a, b) => b.modTime - a.modTime);
  // 卡片描述只取一句话：剥离 HTML、去掉与标题重复的「公司名 Period：」前缀、截到首句并压缩为紧凑一行
  const oneSentence = (html) => {
    let text = (html || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
    const colon = text.indexOf('：');
    if (colon > 0 && colon <= 20) text = text.slice(colon + 1).trim();
    const m = text.match(/^[^。]*。/);
    let s = m ? m[0] : text;
    const MAX = 42;
    if (s.length > MAX) {
      let cut = s.slice(0, MAX);
      const b = Math.max(cut.lastIndexOf('·'), cut.lastIndexOf('，'), cut.lastIndexOf('、'));
      if (b >= 24) cut = cut.slice(0, b);
      s = cut.replace(/[·，、（\s]+$/, '') + '…';
    }
    return s;
  };
  grid.innerHTML = reports.map(r => `
    <a class="report-card" href="${r.file}">
      <div class="ticker">${r.ticker}</div>
      <h3>${r.title}</h3>
      <div class="desc">${oneSentence(r.desc)}</div>
      <div class="meta">
        <span class="tag ${r.tagClass}">${r.tag}</span>
        <span>${r.date}</span>
      </div>
    </a>
  `).join('');
}
renderReports();

/* HAITU:CALENDAR:END */

let currentCalFilter = 'all';

function renderCalendar() {
  const container = document.getElementById('calendarRows');
  if (!calendar.length) {
    container.innerHTML = '<div class="cal-empty">尚无即将到来的事件</div>';
    return;
  }

  // 按日期排序：未来 → 今天 → 过去
  const today = /* HAITU:TODAY:START */ new Date('2026-06-19') /* HAITU:TODAY:END */;
  today.setHours(0, 0, 0, 0);

  calendar.sort((a, b) => new Date(a.date) - new Date(b.date));

  // 窗口筛选：过去 30 天 + 未来全部
  let filtered = calendar.filter(e => {
    const d = new Date(e.date);
    const diffDays = (d - today) / (1000 * 60 * 60 * 24);
    return diffDays >= -30;
  });

  // 类型筛选：财报（含业绩预告）/ 分红 / 全部
  if (currentCalFilter === 'earnings') {
    filtered = filtered.filter(e => e.type === 'earnings' || e.type === 'earnings-notice');
  } else if (currentCalFilter === 'dividend') {
    filtered = filtered.filter(e => e.type === 'ex-div' || e.type === 'payment');
  }

  // 更新事件计数
  const countEl = document.getElementById('calFilterCount');
  if (countEl) countEl.textContent = `${filtered.length} 个事件`;

  if (!filtered.length) {
    container.innerHTML = '<div class="cal-empty">没有符合筛选条件的事件</div>';
    return;
  }

  // 映射：该股票分析页 —— 先从「已发布」事件 detail 提取报告链接，再按名称回退匹配 reports[]
  const reportByXueqiu = {};
  calendar.forEach(ev => {
    const m = (ev.detail || '').match(/href="(haitu\/reports\/[^"]+\.html)"/);
    if (m) reportByXueqiu[ev.xueqiu] = m[1];
  });
  const findReport = (e) => reportByXueqiu[e.xueqiu]
    || ((reports || []).find(r => r.title && e.ticker && r.title.includes(e.ticker)) || {}).file
    || null;

  container.innerHTML = filtered.map(e => {
    const d = new Date(e.date);
    const isPast = d < today;
    const isToday = d.getTime() === today.getTime();
    const cls = [
      isPast ? 'past' : (isToday ? 'today' : 'upcoming'),
      (e.type === 'earnings' || e.type === 'earnings-notice') ? 'is-earnings' : ''
    ].filter(Boolean).join(' ');
    // 整行可点击 → 该股票分析页；无分析页则回退到雪球行情（新标签打开）
    const report = findReport(e);
    const href = report || ('https://xueqiu.com/S/' + e.xueqiu);
    const ext = report ? '' : ' target="_blank" rel="noopener"';
    const tip = report ? '查看海图研判' : '雪球行情';
    return `
      <a class="cal-row ${cls}" href="${href}"${ext} title="${e.ticker} · ${tip}">
        <div class="cal-date">${e.date}</div>
        <div class="cal-ticker">${e.ticker}</div>
        <div><span class="cal-type ${e.type}">${e.typeLabel}</span></div>
      </a>
    `;
  }).join('');

  scrollCalToToday();
}

// 把日历滚动到「今天」（过去事件仍在上方，可向上滚动）
function scrollCalToToday() {
  const container = document.getElementById('calendarRows');
  if (!container) return;
  const anchor = container.querySelector('.cal-row.today') || container.querySelector('.cal-row.upcoming');
  if (!anchor) return;
  container.scrollTop += anchor.getBoundingClientRect().top - container.getBoundingClientRect().top;
}
window.addEventListener('load', scrollCalToToday);
// 事件类型筛选 — 按钮点击
document.querySelectorAll('.cal-filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cal-filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCalFilter = btn.dataset.filter;
    renderCalendar();
  });
});

renderCalendar();

/* ── THEME TOGGLE ── */
function toggleTheme() {
  const d = document.documentElement;
  const btn = document.getElementById('themeBtn');
  if (d.getAttribute('data-theme') === 'dark') {
    d.removeAttribute('data-theme');
    btn.textContent = '🌙';
    localStorage.setItem('theme', 'light');
  } else {
    d.setAttribute('data-theme', 'dark');
    btn.textContent = '☀️';
    localStorage.setItem('theme', 'dark');
  }
}
(function() {
  const t = localStorage.getItem('theme');
  if (t === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('themeBtn').textContent = '☀️';
    });
  }
})();
</script>
