<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海图夜读 · 财报如海图，在风浪里寻找价值。</title>
<link rel="icon" type="image/png" href="haitu/assets/hai.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* 海图夜读 · 深海蓝 + 金色 + 暗红点缀 */
  --bg: #f4ede4;
  --bg-alt: #ebe2d4;
  --card-bg: #ffffff;
  --text: #2d3540;
  --text-secondary: #6a7280;
  --text-dim: #98a0aa;
  --heading: #1a2230;
  --border: #e0d6c8;

  --accent: #2c4054;        /* 深海蓝 */
  --accent-soft: #4a6280;
  --accent-gold: #b08d52;   /* 金色 */
  --accent-red: #b87070;    /* 暗红（呼应海图头像） */

  --green: #5a8068;
  --gold: #b08d52;
  --red: #b87070;
  --tag-bg: #ede5d6;

  --shadow: 0 2px 12px rgba(20,30,50,0.07);
  --shadow-lg: 0 8px 32px rgba(20,30,50,0.12);
}
[data-theme="dark"] {
  --bg: #1a1d24;
  --bg-alt: #22262e;
  --card-bg: #2a2e36;
  --text: #e6dfd2;
  --text-secondary: #a8a092;
  --text-dim: #706860;
  --heading: #f0e8d8;
  --border: #3a3a40;

  --accent: #6a8aaa;
  --accent-soft: #4a6a8a;
  --accent-gold: #c9a872;
  --accent-red: #c08080;

  --green: #7a9a7a;
  --gold: #c9a872;
  --red: #c08080;
  --tag-bg: #34313a;

  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.45);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.4s, color 0.3s;
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

/* ── HERO（压缩版） ── */
.hero {
  display: flex; align-items: center; justify-content: center; gap: 22px;
  padding: 28px 24px;
  background: var(--bg-alt);
  border-bottom: 1px solid var(--border);
  position: relative;
  flex-wrap: wrap;
}
.theme-toggle {
  position: absolute; top: 16px; right: 20px;
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 12px; cursor: pointer;
  font-size: 1rem; transition: all 0.2s;
  box-shadow: var(--shadow);
}
.theme-toggle:hover { transform: scale(1.08); }

.haitu-portrait {
  width: 64px; height: 64px;
  border-radius: 50%;
  display: block;
  border: 2px solid var(--card-bg);
  box-shadow: 0 2px 10px rgba(184, 112, 112, 0.25);
  background: var(--accent-red);
  flex-shrink: 0;
}

.hero-text { display: flex; flex-direction: column; gap: 4px; }

.brand-name {
  font-family: 'Noto Serif SC', Georgia, serif;
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--heading);
  line-height: 1.2;
}
.brand-name .accent { color: var(--accent-red); }

.slogan {
  font-family: 'Noto Serif SC', Georgia, serif;
  font-size: 0.95rem;
  color: var(--text-secondary);
  font-style: italic;
  letter-spacing: 1px;
}
.slogan::before { content: '「'; color: var(--accent-gold); }
.slogan::after { content: '」'; color: var(--accent-gold); }

/* ── SECTION ── */
.section { padding: 40px 0; }
.section.first { padding-top: 32px; }
.section-title {
  display: flex; align-items: center; gap: 12px;
  font-family: 'Noto Serif SC', serif;
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: 2px;
  color: var(--text-secondary);
  margin-bottom: 28px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.section-title::before {
  content: '';
  display: inline-block;
  width: 4px; height: 20px;
  background: var(--accent-gold);
  border-radius: 2px;
}

/* ── REPORT CARDS ── */
.report-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 22px;
}
.report-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 26px;
  text-decoration: none;
  color: var(--text);
  transition: all 0.25s ease;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.report-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--accent-gold);
  opacity: 0.6;
}
.report-card:hover {
  transform: translateY(-4px);
  border-color: var(--accent-gold);
  box-shadow: var(--shadow-lg);
}
.report-card .ticker {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 1.5px;
  margin-bottom: 8px;
}
.report-card h3 {
  font-family: 'Noto Serif SC', serif;
  font-size: 1.18rem;
  font-weight: 600;
  margin-bottom: 10px;
  line-height: 1.45;
  color: var(--heading);
}
.report-card .desc {
  color: var(--text-secondary);
  font-size: 0.91rem;
  line-height: 1.65;
  flex: 1;
  margin-bottom: 16px;
}
.report-card .meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.8rem;
  color: var(--text-dim);
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.tag {
  display: inline-block;
  background: var(--tag-bg);
  padding: 4px 11px;
  border-radius: 11px;
  font-size: 0.74rem;
  font-weight: 500;
  letter-spacing: 0.3px;
}
.tag.buy { color: var(--green); background: rgba(90,128,104,0.13); }
.tag.hold { color: var(--gold); background: rgba(176,141,82,0.13); }
.tag.sell { color: var(--red); background: rgba(184,112,112,0.13); }

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center;
  padding: 60px 24px;
  color: var(--text-dim);
  font-style: italic;
  background: var(--card-bg);
  border: 1px dashed var(--border);
  border-radius: 14px;
}
.empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.5; }

/* ── ABOUT ── */
.about-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 36px 40px;
  box-shadow: var(--shadow);
  font-family: 'Noto Serif SC', serif;
  line-height: 2.0;
  font-size: 1rem;
  color: var(--text);
}
.about-card p { margin-bottom: 16px; }
.about-card p:last-child { margin-bottom: 0; }
.about-card strong { color: var(--accent-red); }

/* ── FOOTER ── */
footer {
  text-align: center;
  margin-top: 40px;
  padding: 32px 24px 40px;
  border-top: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 0.82rem;
  background: var(--bg-alt);
}
footer p { margin-bottom: 6px; }

@media (max-width: 768px) {
  .brand-name { font-size: 1.4rem; letter-spacing: 2px; }
  .slogan { font-size: 0.88rem; }
  .haitu-portrait { width: 56px; height: 56px; }
  .hero { padding: 22px 20px; gap: 16px; }
  .section { padding: 32px 0; }
}
</style>
</head>
<body>

<header class="hero">
  <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
  <img src="haitu/assets/hai.png" alt="海图" class="haitu-portrait">
  <div class="hero-text">
    <h1 class="brand-name">海图<span class="accent">夜读</span></h1>
    <div class="slogan">财报如海图，在风浪里寻找价值。</div>
  </div>
</header>

<div class="container">

  <section class="section first">
    <div class="section-title">🌙 海图研判 · 按发布时间排序</div>
    <div class="report-grid" id="reportGrid"></div>
  </section>

  <section class="section">
    <div class="section-title">📜 关于海图夜读</div>
    <div class="about-card">
      <p>每一份上市公司财报都是一张<strong>海图</strong>——记录着企业过去的航迹，也暗示着未来的水深与暗礁。</p>
      <p>《海图夜读》是一档专注于<strong>价值投资</strong>的财报研究栏目。我们以护城河、所有者盈余、安全边际为锚点，输出 12 模块深度分析与 6 维海图评分卡。</p>
    </div>
  </section>

</div>

<footer>
  <p>《海图夜读》 · 价值投资研究站</p>
  <p>所有内容仅供研究参考，不构成投资建议。市场有风险，投资需谨慎。</p>
  <p>© 2026 Haitu Night Reading</p>
</footer>

<script>
/* ── REPORT DATA — sorted by modTime desc (newest first) ── */
const reports = [
  {
    file: "haitu/reports/haier-q1-2026.html",
    ticker: "HKEX: 06690",
    title: "海尔智家 Haier Smart Home Q1 2026 + FY2025 海图研判",
    desc: "Q1 2026 出现 6 年来首次单季双降——营收 ¥736.9亿(-6.86%)/净利 ¥46.5亿(-15.22%)，被北美暴风雪 + 关税双击。但剔除北美整体经营利润 +10%+，中国主战场在行业 -6.2% 中逆势 +。H 股 P/E 9x · AH 折价 37% · 股息率 5.7% · 目标价 HKD 26（+27%）· Q2 是关键验证窗口",
    tag: "买入 / Q1 双降略降仓位",
    tagClass: "buy",
    date: "2026-04-29",
    modTime: 1777431300000
  },
  {
    file: "haitu/reports/pdd-q4-2025.html",
    ticker: "NASDAQ: PDD",
    title: "PDD Holdings 拼多多 FY2025 海图研判",
    desc: "中国低线消费的低价基础设施 + Temu 全球出海机器 + ¥4,223 亿现金堡垒。FY2025 营收 ¥4,318亿(+10%) · 净利 -12%（主动让利换 Temu 转型 + 千亿扶持）· FCF Yield 10.5% · 核心业务 P/E 仅 6.1x · 海图评分 6 维 B--B-B--A-C+-B+ · 红旗触发降级",
    tag: "有条件买入 / 中低仓位",
    tagClass: "hold",
    date: "2026-04-28",
    modTime: 1777340000000
  },
  {
    file: "haitu/reports/tencent-q4-2025.html",
    ticker: "HKEX: 0700",
    title: "腾讯控股 Tencent FY2025 海图研判",
    desc: "14 亿微信用户构成的中国数字基础设施 + 全球第一的游戏帝国 + 一万亿规模的投资组合。FY2025 营收 ¥7,517.7亿(+14%) · FCF ¥1,826亿(+18%) · 海图评分 6 维 A-A-A-A-B+-B+ · 公允价值 HKD 615",
    tag: "买入 / 核心仓配置",
    tagClass: "buy",
    date: "2026-04-28",
    modTime: 1777334400000
  },
];

function renderReports() {
  const grid = document.getElementById('reportGrid');
  if (reports.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column: 1 / -1;">
        <div class="empty-icon">🌊</div>
        <p>第一份海图研判正在准备中……</p>
      </div>
    `;
    return;
  }
  reports.sort((a, b) => b.modTime - a.modTime);
  grid.innerHTML = reports.map(r => `
    <a class="report-card" href="${r.file}">
      <div class="ticker">${r.ticker}</div>
      <h3>${r.title}</h3>
      <div class="desc">${r.desc}</div>
      <div class="meta">
        <span class="tag ${r.tagClass}">${r.tag}</span>
        <span>${r.date}</span>
      </div>
    </a>
  `).join('');
}
renderReports();

/* ── THEME TOGGLE ── */
function toggleTheme() {
  const d = document.documentElement;
  const btn = document.getElementById('themeBtn');
  if (d.getAttribute('data-theme') === 'dark') {
    d.removeAttribute('data-theme');
    btn.textContent = '🌙';
    localStorage.setItem('theme', 'light');
  } else {
    d.setAttribute('data-theme', 'dark');
    btn.textContent = '☀️';
    localStorage.setItem('theme', 'dark');
  }
}
(function() {
  const t = localStorage.getItem('theme');
  if (t === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('themeBtn').textContent = '☀️';
    });
  }
})();
</script>
</body>
</html>
