<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="海图夜读">
  <!-- 莫兰迪蓝底白字 H。用 <rect> 拼字形而不是 <text>，
       因为 favicon 渲染环境不保证有字体，<text> 在部分浏览器里会渲染成空白。 -->
  <rect width="64" height="64" rx="14" fill="#7b8fa0"/>
  <g fill="#ffffff">
    <rect x="17" y="15" width="8" height="34" rx="1.5"/>
    <rect x="39" y="15" width="8" height="34" rx="1.5"/>
    <rect x="17" y="28" width="30" height="8" rx="1.5"/>
  </g>
</svg>
